    <meta name="shell-type" content="web_standard" />
    <title>LUMEXA | Fast Single Page Web Apps</title>
    <meta
      name="description"
      content="LUMEXA builds fast, mobile-friendly single page web apps for small businesses with simple pricing and quick delivery."

    <link rel="icon" type="image/png" href="assets/lumexa-icon.png" />

      @layer base {
        html,
        body {
          margin: 0;
          padding: 0;
        }

        body {
          overscroll-behavior: none;
        }

        main > :first-child {
          margin-top: 0 !important;
        }

        main > :last-child {
          margin-bottom: 0 !important;
        }
      }

      ::-webkit-scrollbar {
        display: none;
